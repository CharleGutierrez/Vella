<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vella Google Earth Clone</title>
  <!-- Include CesiumJS from CDN -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
      body { margin: 0; padding: 0; overflow: hidden; background: #000; }
      #cesiumContainer { width: 100vw; height: 100vh; }
      #title {
          position: absolute;
          top: 20px;
          left: 20px;
          color: white;
          font-family: sans-serif;
          z-index: 10;
          background: rgba(0,0,0,0.7);
          padding: 15px;
          border-radius: 8px;
          border: 1px solid #333;
      }
  </style>
</head>
<body>
  <div id="title">
    <h2>🌍 Vella Spatial Engine</h2>
    <p>Powered by Rust & CesiumJS</p>
  </div>
  <div id="cesiumContainer"></div>
  
  <script>
    // Initialize the 3D Viewer (Disable default Ion imagery)
    const viewer = new Cesium.Viewer('cesiumContainer', {
        baseLayerPicker: false,
        geocoder: false,
        animation: false,
        timeline: false,
        baseLayer: false
    });

    // Load ArcGIS Satellite Imagery asynchronously (fixes Cesium 1.114 API changes)
    Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer')
        .then(function(provider) {
            viewer.imageryLayers.addImageryProvider(provider);
        });

    // Drop a pin
    viewer.entities.add({
        name: 'Vella HQ',
        position: Cesium.Cartesian3.fromDegrees(-122.4194, 37.7749, 100), // San Francisco
        point: {
            pixelSize: 15,
            color: Cesium.Color.RED,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2
        },
        label: {
            text: 'Vella Engine Active',
            font: '14pt sans-serif',
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            outlineWidth: 2,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -9)
        }
    });

    // Zoom out to view the entire planet spinning in space
    viewer.camera.flyHome(0);

    // Make the globe spin automatically!
    viewer.clock.onTick.addEventListener(function(clock) {
        viewer.scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, 0.002);
    });
  </script>
</body>
</html>
