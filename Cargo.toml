[package]
name = "vella"
version = "0.1.0"
edition = "2021"
authors = ["Vella Team"]
description = "Next-Generation LLM-Native Rust Web Engine & Headless CMS. Bridging PocketBase and Supabase with native vector search, agentic schema scaffolding, AI middleware, zero-config TypeScript sync, realtime WebSocket/SSE, and multi-database scale."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["backend", "framework", "pocketbase", "supabase", "pgvector", "rag", "headless-cms", "realtime"]
categories = ["web-programming::http-server", "database", "command-line-utilities"]
repository = "https://github.com/CharleGutierrez/Vella"
homepage = "https://github.com/CharleGutierrez/Vella"
documentation = "https://github.com/CharleGutierrez/Vella/tree/main/docs"

[dependencies]
scylla = "0.13"
sgp4 = "0.3"
num-complex = "0.4"
cid = "0.11"
multihash = "0.19"
memmap2 = "0.9"
tokio-modbus = "0.14"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
redis = { version = "0.25", features = ["tokio-comp"] }
object_store = { version = "0.9", features = ["aws"] } # Added for S3/Azure/GCP and Local storage
bytes = "1.4"
rhai = { version = "1.18", features = ["serde", "sync"] } # Embedded scripting engine for zero-recompile extensibility
tokio-cron-scheduler = "0.10" # Background jobs and task scheduling
# candle-core = "0.5" # Temporarily disabled due to rand v0.8/0.9 trait conflicts
regex = "1.10" # Used for document chunking
text-splitter = "0.13" # Chunking algorithm for RAG
reqwest = { version = "0.11", features = ["json"] } # AI Gateway HTTP client
opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["tonic"] }
tracing-opentelemetry = "0.23"
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tower = { version = "0.5" }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "catch-panic", "fs"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "postgres", "mysql", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.30.0"
yrs = "0.27.4"
sysinfo = "0.39.6"
tfhe = { version = "1.7.0", features = ["boolean", "integer", "shortint"] }
bellman = "0.14.0"
bls12_381 = "0.8.0"
rust-hdl = "0.46.0"
num-traits = "0.2.19"

[[bin]]
name = "vella"
path = "src/main.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "todo_app"
path = "examples/todo_app.rs"

[[example]]
name = "rag_ai_app"
path = "examples/rag_ai_app.rs"

[[example]]
name = "ultimate_demo"
path = "examples/ultimate_demo.rs"

[[example]]
name = "google_earth_clone"
path = "examples/google_earth_clone.rs"
