[package]
name = "vella"
version = "0.1.0"
edition = "2021"
authors = ["Vella Team"]
description = "Next-Generation LLM-Native Rust Web Engine & Headless CMS. Bridging PocketBase and Supabase with native vector search, agentic schema scaffolding, AI middleware, zero-config TypeScript sync, realtime WebSocket/SSE, and multi-database scale."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["backend", "framework", "pocketbase", "supabase", "pgvector", "rag", "headless-cms", "realtime"]
categories = ["web-programming::http-server", "database", "command-line-utilities"]

[dependencies]
redis = { version = "0.25", features = ["tokio-comp"] }
opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["tonic"] }
tracing-opentelemetry = "0.23"
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tower = { version = "0.5" }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "catch-panic", "fs"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "postgres", "mysql", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

[[bin]]
name = "vella"
path = "src/main.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[example]]
name = "todo_app"
path = "examples/todo_app.rs"

[[example]]
name = "rag_ai_app"
path = "examples/rag_ai_app.rs"

[[example]]
name = "ultimate_demo"
path = "examples/ultimate_demo.rs"
