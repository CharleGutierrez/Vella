name: Bug Report
description: Create a report to help us improve Vella
title: "[BUG] "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Vella Version
      description: Which version of Vella are you using?
      placeholder: e.g., 0.1.0 or main branch
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / Environment
      description: Are you on Linux, macOS, or Windows? What version of Rust?
    validations:
      required: true
