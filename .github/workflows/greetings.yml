name: "Welcome First-Time Contributors"

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to the Vella framework! 🚀 
            
            Thank you for opening your first issue. Our autonomous AI tuner is currently analyzing your report. In the meantime, please ensure you've provided your OS, Rust version, and a minimal reproducible example if this is a bug. A human maintainer will also take a look shortly!
          pr-message: |
            Welcome to Vella! 🎉
            
            Thank you for your first pull request! You are now part of the God-Tier Decentralized OS movement. 
            Before we merge, our CI will automatically run tests and clippy checks. Please make sure all checks pass. If you need any help, don't hesitate to ask!
